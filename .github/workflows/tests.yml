name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pyyaml
      - name: write-time checker
        run: python -X utf8 -B 规范/交接写时门/tests/test_gate.py
      - name: daily learning (fake model and fake claude subprocess, no network)
        run: python -X utf8 -B 规范/交接写时门/tests/test_lessons.py
      - name: watchdog (no popups, no registry, no real scheduled tasks)
        run: python -X utf8 -B 规范/交接写时门/tests/test_notify.py
      - name: notifications and decision page (toast dry run only on Windows; SKIP elsewhere)
        shell: bash
        run: |
          python -X utf8 -B 规范/交接写时门/tests/test_ui.py | tee test_ui.log
          # Publish the summary line (counts and any SKIPs) as an annotation, readable without signing in
          echo "::notice title=test_ui ${{ matrix.os }} py${{ matrix.python }}::$(grep -E '^合计' test_ui.log)"
      - name: workflow-rules scanner (report-only)
        run: python -X utf8 -B 规范/交接写时门/tests/test_flow.py
      - name: command-line entry point (temporary runtime dir, touches no real install)
        run: python -X utf8 -B 规范/交接写时门/tests/test_ctl.py
